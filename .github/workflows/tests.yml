# Runs the test suite on every push, on Linux AND Windows — so Windows-only
# bugs (cp1252 encodings, path separators, schtasks) show up here before they
# show up on the lab PC.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./ionomos[dev]"
      - run: python -m ruff check ionomos/src ionomos/tests
      - run: python -m pytest ionomos -q -rs
        env:
          IONOMOS_OFFLINE: "1"
      # JS harness for the report front end (dev-only; jsdom). Same job so a
      # front-end regression fails the same red run on both OSes.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ionomos/tests/js/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: ionomos/tests/js
      - run: npm test
        working-directory: ionomos/tests/js
