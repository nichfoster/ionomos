# Builds Ionomos on a GitHub Windows machine: the installer (Ionomos-Setup-<v>.exe) and a
# portable zip, tests both for real, and attaches them to a GitHub Release.
#
#   tag a version:      git tag v0.5.0 && git push --tags     -> release "v0.5.0" with both files
#   or on demand:       GitHub -> Actions -> build-exe -> Run workflow   -> files under "Artifacts"
name: build-exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File deploy\build_exe.ps1
      - name: Smoke test the console exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\Ionomos-*-windows\ionomos-cli.exe | Select-Object -First 1
          & $exe --version
          & $exe testbed init C:\bed
          & $exe --config C:\bed\Fragpipe_Auto\config.yaml check
          # full frozen pipeline: watcher files the drop, worker runs the (fake) FragPipe
          $env:IONOMOS_FAKE_FP_SECONDS = "1"
          $w = Start-Process -FilePath $exe -ArgumentList "--config C:\bed\Fragpipe_Auto\config.yaml run --no-gui" -PassThru -NoNewWindow
          & $exe testbed drop iso_good C:\bed
          & $exe testbed drop dia_good C:\bed
          $done = $false
          foreach ($i in 1..90) {
            Start-Sleep 2
            $s = & $exe --config C:\bed\Fragpipe_Auto\config.yaml status --all | Out-String
            if (([regex]::Matches($s, "(?m)^\s*\d+\s+done\b")).Count -ge 2) { $done = $true; break }
          }
          Stop-Process -Id $w.Id -Force
          Write-Host $s
          Get-Content C:\bed\Fragpipe_Auto\logs\ionomos.log -Tail 15
          if (-not $done) { throw "frozen exe did not complete a job" }
          $report = "C:\bed\Fragpipe_General\EJQ\20260902-isoDTB_EJQ-2-027\results\report.html"
          if (-not (Test-Path $report)) { throw "frozen exe did not write the analysis report" }
          $html = Get-Content $report -Raw
          if ($html -notmatch "ionomos-report-v2" -or $html -notmatch "function niceTicks") { throw "report assets (report.js) missing from the frozen exe" }
          # the DIA job went through the FragPipe-Analyst pipeline (imputation, limma, QC, R export)
          $dia = Get-ChildItem C:\bed\Fragpipe_General\Isaac -Directory | Select-Object -First 1
          $sum = Get-Content (Join-Path $dia.FullName "results\analysis.json") -Raw | ConvertFrom-Json
          if ($sum.imputation -ne "perseus" -or $sum.comparisons.Count -lt 1) { throw "DIA analysis incomplete: $($sum | ConvertTo-Json -Depth 3)" }
          if (-not (Test-Path (Join-Path $dia.FullName "results\fragpipe-analyst\reproduce_in_R.R"))) { throw "no FragPipe-Analyst export" }
          & $exe analyze C:\bed\Fragpipe_General\EJQ\20260902-isoDTB_EJQ-2-027 --test welch
          if ($LASTEXITCODE -ne 0) { throw "frozen exe: ionomos analyze failed" }
          & $exe init --root C:\bed2\Auto --users C:\bed2\General
          # stress the frozen build: messy drops + chaos, invariant checks
          $env:IONOMOS_FAKE_FP_SECONDS = "0.2"
          & $exe testbed stress --n 60 --seed 3 --fuzz 2000
          if ($LASTEXITCODE -ne 0) { throw "stress test failed on the frozen exe" }
      - name: Installer - install, retire a fake LabWatch, upgrade, uninstall (data must survive)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem dist\Ionomos-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer was built" }
          # a LabWatch 0.4 install to retire, and lab data that must never be touched
          New-Item -ItemType Directory -Force C:\Fragpipe_Auto | Out-Null
          Set-Content C:\Fragpipe_Auto\LabWatch.exe "old program"
          Set-Content C:\Fragpipe_Auto\config.yaml "# the lab's settings"
          schtasks /Create /TN labwatch /TR "cmd /c exit" /SC ONLOGON /F | Out-Null
          # wait for the installer process only: -Wait would also wait for the app it reopens
          function RunSetup($exe, $a) { $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru; $p.WaitForExit(); Start-Sleep 2 }
          RunSetup $setup.FullName "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=C:\IonomosT /LOG=C:\ionomos-install.log"
          if (-not (Test-Path C:\IonomosT\Ionomos.exe)) { Get-Content C:\ionomos-install.log -Tail 40; throw "install failed" }
          $v = & C:\IonomosT\ionomos-cli.exe --version; Write-Host $v
          if ($v -notmatch "installed") { throw "installed build does not know it is installed: $v" }
          if (Test-Path C:\Fragpipe_Auto\LabWatch.exe) { throw "the old LabWatch exe was not retired" }
          schtasks /Query /TN labwatch 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "the old labwatch startup task was not removed" }
          # upgrade in place (same folder remembered)
          RunSetup $setup.FullName "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          if (-not (Test-Path C:\IonomosT\Ionomos.exe)) { throw "upgrade lost the program" }
          # uninstall
          RunSetup C:\IonomosT\unins000.exe "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          foreach ($i in 1..30) { if (-not (Test-Path C:\IonomosT\Ionomos.exe)) { break }; Start-Sleep 2 }
          if (Test-Path C:\IonomosT\Ionomos.exe) { throw "uninstall left the program behind" }
          if ((Get-Content C:\Fragpipe_Auto\config.yaml) -ne "# the lab's settings") { throw "the lab's config was touched" }
          Write-Host "installer OK: install, LabWatch retirement, upgrade, uninstall; data kept"
          exit 0  # the expected non-zero from 'schtasks /Query' above must not fail the step
      - uses: actions/upload-artifact@v4
        with:
          name: Ionomos-windows
          path: |
            dist/Ionomos-Setup-*.exe
            dist/Ionomos-*-windows.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Ionomos-Setup-*.exe
            dist/Ionomos-*-windows.zip
          generate_release_notes: true
