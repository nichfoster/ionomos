# Builds LabWatch.exe / labwatch.exe on a GitHub Windows machine and attaches
# the zip to a GitHub Release. Nothing to build by hand, ever.
#
#   tag a version:      git tag v0.2.0 && git push --tags     -> release "v0.2.0" with the zip
#   or on demand:       GitHub -> Actions -> build-exe -> Run workflow   -> zip under "Artifacts"
name: build-exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File deploy\build_exe.ps1
      - name: Smoke test the console exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\LabWatch-*-windows\labwatch.exe | Select-Object -First 1
          & $exe --version
          & $exe testbed init C:\bed
          & $exe --config C:\bed\Fragpipe_Auto\config.yaml check
      - uses: actions/upload-artifact@v4
        with:
          name: LabWatch-windows
          path: dist/LabWatch-*-windows.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LabWatch-*-windows.zip
          generate_release_notes: true
