# Builds LabWatch.exe / labwatch-cli.exe on a GitHub Windows machine and attaches
# the zip to a GitHub Release. Nothing to build by hand, ever.
#
#   tag a version:      git tag v0.2.0 && git push --tags     -> release "v0.2.0" with the zip
#   or on demand:       GitHub -> Actions -> build-exe -> Run workflow   -> zip under "Artifacts"
name: build-exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File deploy\build_exe.ps1
      - name: Smoke test the console exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\LabWatch-*-windows\labwatch-cli.exe | Select-Object -First 1
          & $exe --version
          & $exe testbed init C:\bed
          & $exe --config C:\bed\Fragpipe_Auto\config.yaml check
          # full frozen pipeline: watcher files the drop, worker runs the (fake) FragPipe
          $env:LABWATCH_FAKE_FP_SECONDS = "1"
          $w = Start-Process -FilePath $exe -ArgumentList "--config C:\bed\Fragpipe_Auto\config.yaml run --no-gui" -PassThru -NoNewWindow
          & $exe testbed drop iso_good C:\bed
          $done = $false
          foreach ($i in 1..60) {
            Start-Sleep 2
            $s = & $exe --config C:\bed\Fragpipe_Auto\config.yaml status --all | Out-String
            if ($s -match "\bdone\b") { $done = $true; break }
          }
          Stop-Process -Id $w.Id -Force
          Write-Host $s
          Get-Content C:\bed\Fragpipe_Auto\logs\labwatch.log -Tail 15
          if (-not $done) { throw "frozen exe did not complete a job" }
          $report = "C:\bed\Fragpipe_General\EJQ\20260902-isoDTB_EJQ-2-027\results\report.html"
          if (-not (Test-Path $report)) { throw "frozen exe did not write the analysis report" }
          & $exe analyze C:\bed\Fragpipe_General\EJQ\20260902-isoDTB_EJQ-2-027 --test welch
          if ($LASTEXITCODE -ne 0) { throw "frozen exe: labwatch analyze failed" }
          & $exe init --root C:\bed2\Auto --users C:\bed2\General
          # stress the frozen build: messy drops + chaos, invariant checks
          $env:LABWATCH_FAKE_FP_SECONDS = "0.2"
          & $exe testbed stress --n 60 --seed 3 --fuzz 2000
          if ($LASTEXITCODE -ne 0) { throw "stress test failed on the frozen exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: LabWatch-windows
          path: dist/LabWatch-*-windows.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LabWatch-*-windows.zip
          generate_release_notes: true
