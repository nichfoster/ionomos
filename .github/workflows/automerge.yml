# Auto-merge bot: squash-merges every open, non-draft PR once ALL of its checks
# are green and every REQUIRED check has passed. Conflicting or red PRs are left
# alone — the agent that opened them has to fix them.
#
#   Opt a PR out:   add the label  no-automerge   (or keep it a draft)
#   Run it now:     Actions -> automerge -> Run workflow
#
# Merges made with the Actions token don't trigger push workflows, so after a
# merge the bot dispatches CI on master itself to keep the branch verified.
name: automerge

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
  pull_request:
    types: [ready_for_review, unlabeled]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read      # statusCheckRollup needs these two; without them the
  statuses: read    # GraphQL query fails with "Resource not accessible"

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BASE: master
      REQUIRED: "test (ubuntu-latest),test (windows-latest)"
      CI_WORKFLOW: tests.yml
    steps:
      - name: Merge green PRs
        run: |
          set -uo pipefail
          merged=0
          prs=$(gh pr list -R "$REPO" --base "$BASE" --state open --limit 100 \
            --json number,isDraft,isCrossRepository,labels \
            --jq '.[] | select(.isDraft|not) | select(.isCrossRepository|not)
                  | select([.labels[].name] | index("no-automerge") | not) | .number')
          for n in $prs; do
            info=$(gh pr view "$n" -R "$REPO" --json mergeable,headRefName,statusCheckRollup) \
              || { echo "#$n: could not read PR — skipping"; continue; }
            if [ "$(jq -r .mergeable <<<"$info")" != "MERGEABLE" ]; then
              echo "#$n: $(jq -r .mergeable <<<"$info") — skipping"; continue
            fi
            verdict=$(jq -r --arg req "$REQUIRED" '
              def nm: (.name // .context);
              def ok: if .__typename == "StatusContext" then .state == "SUCCESS"
                      else .status == "COMPLETED" and (.conclusion | IN("SUCCESS","SKIPPED","NEUTRAL")) end;
              # one verdict per check name: the most recent run wins (PRs can
              # carry duplicate push + pull_request runs, or cancelled reruns)
              [.statusCheckRollup[] | select(.workflowName != "automerge")]
              | group_by(nm) | map(sort_by(.startedAt // .completedAt // "") | last) as $c
              | ($req | split(",") | map(select(length > 0))) as $r
              | if ($c | length) == 0 then "no checks yet"
                elif any($c[]; ok | not) then "checks pending or failing"
                elif any($r[]; . as $x | ($c | map(nm) | index($x)) == null) then "required check missing"
                else "ok" end' <<<"$info")
            if [ "$verdict" != "ok" ]; then echo "#$n: $verdict — skipping"; continue; fi
            branch=$(jq -r .headRefName <<<"$info")
            if gh pr merge "$n" -R "$REPO" --squash; then
              echo "#$n: merged"; merged=1
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1 || true
            else
              # the Actions token cannot merge PRs that change .github/workflows
              echo "#$n: merge failed (workflow-file changes need a manual merge)"
            fi
          done
          if [ "$merged" = 1 ] && [ -n "$CI_WORKFLOW" ]; then
            gh workflow run "$CI_WORKFLOW" -R "$REPO" --ref "$BASE" || true
          fi
