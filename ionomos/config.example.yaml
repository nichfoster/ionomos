# ionomos configuration — copy to C:/Fragpipe_Auto/config.yaml and edit.
# Forward slashes are fine on Windows. NO SPACES in any path (FragPipe rule).

paths:
  inbox:        C:/Fragpipe_Auto/inbox
  users_root:   C:/Fragpipe_General          # jobs land in users_root/<USER>/<experiment>
  fragpipe_exe: C:/FragPipe/FragPipe-24.0/bin/fragpipe.bat   # the headless launcher (not FragPipe-24.0.exe)
  workflow_dir: C:/Fragpipe_Auto/workflows
  fasta_dir:    C:/Fragpipe_Auto/fasta
  database:     C:/Fragpipe_Auto/ionomos.db
  log_dir:      C:/Fragpipe_Auto/logs

watcher:
  poll_seconds: 10
  stable_seconds: 60          # whole-tree fingerprint must be unchanged this long
  min_raw_files: 1

fragpipe:
  auto_run: true              # run FragPipe on queued jobs automatically (false = only file them)
  threads: 28                 # machine has 32 logical CPUs
  ram_gb: 48                  # machine has 64 GB
  timeout_minutes: 240
  min_free_gb: 20             # a search waits while the data drive has less free space than this + its raws
  config_tools_folder: ""     # leave blank unless the first headless run can't find tools
  config_diann: ""            # e.g. C:/DIA-NN/2.3.2/DiaNN.exe — DIA only, if needed
  config_python: ""           # e.g. C:/FragPipe/FragPipe-24.0/python — only if FragPipe can't find its Python

# What happens after FragPipe: statistics, volcano plots and results/report.html.
# An experiment can override any of these in its experiment.yaml under analysis:
# (e.g. comparisons: ["Drug vs DMSO"], control: DMSO).
analysis:
  enabled: true
  test: moderated            # moderated (limma-style empirical Bayes, recommended for n=3) | welch | student
  log2fc: 1.0                # |log2 fold change| needed to call a hit
  alpha: 0.05                # significance cut-off
  use_adjusted: true         # alpha applies to Benjamini-Hochberg q-values
  min_valid: 2               # values needed per group to test a protein/site
  normalize: auto            # auto: median centring, or the ratio method when many features change one way (D64)
                             # | median | gn | ratio | none (intensities only)
  top_labels: 15             # hit names written on each volcano
  control_keywords: [DMSO, vehicle, veh, ctrl, control, mock, untreated, NT, WT, EV, scr, scramble, siNT, PBS]
  # Roles (D61): each condition is a control, a compound, a competition (probe + competitor), a pooled reference
  # or a QC standard, read from its name. A competition changes the default comparisons to compound vs control,
  # competition vs its compound, competition vs control, and adds results/specific_targets.tsv.
  competition_keywords: [comp, competition, competitor, competed, compete, competing, excess]   # NOT confirmed by the lab
  # competition_keywords_weak: [pre, pretreat, pretreated, pretreatment, block, blocked, blocking, cold]
  #                            # count only next to the compound's own condition (Probe_pre + Probe); asked about
  # roles: {DMSO: control, Probe: compound, Probe_Comp: competition of Probe}   # usually in experiment.yaml
  # role_comparisons: false  # roles are shown, but every condition is compared with the control (as before 0.14)
  # small_group_min_valid: same   # half (default): the smaller group of an unequal comparison (DMSO n=2 vs n=4)
  #                               # needs half its samples measured instead of min_valid, when nothing is imputed
  # block: replicate         # the replicate number as a block (batch / pair) in the limma model (D42)
  # variance_prior: deqms    # limma (default) | deqms: prior variance by peptide count (D43)
  # Exported figures (D62): the lab's style. The report's Export dialog starts from it ("Reset to lab
  # defaults" goes back to it), and `ionomos export <experiment>` writes static SVG figures with it.
  export:
    size: slide169           # slide169 (16:9, 1280 x 720 px) | slide43 | half | col1 (85 mm) | col2 (180 mm)
                             # | custom, with width: 900, height: 600, unit: px (or mm)
    font_pt: 14              # text size in points in the finished figure (14 suits a slide, 7 a journal column)
    font_family: Arial       # the font's name; it must be installed where the figure is opened
    palette: default         # default | colorblind (Okabe-Ito) | grey | custom, with up: "#d55e00",
                             # down: "#0072b2", neutral: "#b3b3b3"
    background: light        # light | dark | transparent
    figures: []              # static SVG written to results/figures/ after each analysis: any of
                             # volcano, pca, heatmap, correlation (or all). [] = none; the report exports all
    # also: line_scale: 1, point_scale: 1, title / subtitle / legend / note: true, labels: screen | top | none,
    # label_count: 15, png_scale: 2, png_dpi: 0 (the report's PNG), zip_format: both | svg | png

# Instrument QC (docs/QC_TREND.md): runs of the lab's QC standard (a HeLa / K562 digest) are trended
# in logs/qc_trend.html, with Levey-Jennings charts and Westgard rules. Does nothing until one is searched.
qc_trend:
  enabled: true
  match: [hela, k562, qc_std, qcstd, _qc_]   # words in a folder or .raw name (any case; _ - . and spaces alike)
  exclude: []                 # names with these words are never QC runs, e.g. [hela-ko]
  methods: []                 # every run of these methods is a QC run (a dedicated QC method)
  instrument: ""              # a label for the page, e.g. Eclipse
  baseline_runs: 10           # the first N runs of a series set its mean and SD ...
  baseline_from: ""           # ... or pin it to the runs acquired between two dates (YYYY-MM-DD)
  baseline_to: ""
  popup: false                # true: a broken rule opens a window (default: only the attention list)

# Notifications (docs/ARCHITECTURE.md "Notifications"): a message when a search is done, failed or
# waiting. OFF by default: nothing leaves this PC unless you turn it on. A message carries the experiment
# name, user, method, status, the reason or the hit counts, and the local path of the report. Never a
# file, never a quantity. Webhook addresses and the password are secrets: they are left out of logs and
# of every diagnostics report. Try it with: ionomos notify-test   (restart the watcher after a change)
notify:
  enabled: false
  on: [done, failed, held]    # which events send a message (held = a search is waiting for something)
  include_names: true         # false: only the job number and the status are sent
  timeout_seconds: 10         # a channel that doesn't answer is given up on; jobs never wait for it
  webhook:                    # any service that takes a JSON POST
    url: ""                   # https://...
    url_env: ""               # or the NAME of an environment variable that holds the address
  teams:                      # Microsoft Teams: a Workflows "when a webhook request is received" address
    url: ""
    url_env: ""
  slack:                      # Slack: an incoming-webhook address (https://hooks.slack.com/services/...)
    url: ""
    url_env: ""
  email:                      # SMTP; no host = no email
    host: ""                  # e.g. smtp.office365.com
    port: 587
    security: starttls        # starttls | ssl (port 465) | none (an internal relay; no password allowed)
    username: ""
    password: ""
    password_env: ""          # better than password: the NAME of an environment variable that holds it
    from: ""                  # e.g. proteomics-pc@yourlab.org
    to: []                    # e.g. [you@yourlab.org]

# The assistant: `ionomos ask "why did my search fail?" --experiment 12` (docs/ASSISTANT.md, D49 / D57).
# Off by default. It needs a model runtime that the lab installs on this PC (Ollama, or llama.cpp's
# llama-server): Ionomos ships no runtime and no model. It only reads, and it only talks to this PC.
assistant:
  enabled: false
  base_url: http://127.0.0.1:11434/v1   # the runtime's OpenAI-compatible address on this PC (Ollama's default;
                                        # llama-server: http://127.0.0.1:8080/v1). Any other computer is refused.
  model: ""                   # the model's name in that runtime; none is recommended yet (ROADMAP Phase 6.0)
  maintainer: ""              # who "ask the maintainer" names, e.g. "Nick (nick@lab.example)"
  timeout_seconds: 120        # how long to wait for the model
  stream: true                # false if the runtime can't stream tool calls
  allow_cloud: false          # reserved for ROADMAP 6.4; a non-local base_url is refused whatever this says

# Who is who. Users are the subfolders of users_root; a new user = a new folder.
# Aliases let initials in a folder name resolve to that folder.
users:
  aliases:
    Isaac: [IJ, IJD]
    EJQ: [EJQ_2]
  default: ""                 # e.g. "_unsorted" — file unrecognised users there instead of rejecting
  # learned_aliases_file: C:/Fragpipe_Auto/learned_aliases.yaml   # written by the resolver window

# The naming window: shows every drop for review before it is filed (review_drops), and asks when a
# folder can't be interpreted (unknown user, no method, odd file names, uneven fractions). Needs the
# watcher to run in an interactive session (Task Scheduler "run only when user is logged on").
gui:
  enabled: true
  review_drops: true          # show how each drop was read (conditions, replicates, control) before filing
  timeout_minutes: 0          # 0 = wait for a person; N = after N minutes a review files as read, a problem is skipped

# DIA short forms: a 1-2 letter code glued to the replicate, X_D1 = DMSO rep 1, X_C2 = Compound rep 2.
# Longer codes count only when listed here.
naming:
  condition_codes:
    D: DMSO
    C: Compound
  # Another lab's convention (docs/NAMING_CONVENTION.md "Other conventions"). Leave these out to keep
  # the built-in rules; check a change with `ionomos names test <folder> <file.raw> ...`.
  # date_formats: [YYYYMMDD, MMDDYYYY, MMDDYY]   # also DDMMYYYY, DDMMYY, YYMMDD; tried in order
  # methods:                                     # how each method's .raw names are read (quote templates)
  #   isoDTB: '{sample}_{rep}[_{fraction}]'      # the built-in rules, written out
  #   TMT: '{sample}[_TMT][_{fraction}]'
  #   DIA: '{sample}[_{rep}]'
  #   (or, for WT-a_rep1.raw / KO-b_rep2.raw:  DIA: '{condition}_rep{rep}')
  #   LFQ: {files: '{sample}_R{rep}_F{fraction}'}   # a new method (add methods.LFQ below too)
  #   SWATH: {like: DIA}                         # a DIA method under another name: DIA's rule, search and analysis
  #   (like: isoDTB | TMT | DIA makes the method that kind everywhere, not only for its names; D54)
  #   PLATE: {pattern: '(?P<sample>[A-H]\d{2})-(?P<rep>\d+)'}   # a regex with named groups

# One entry per method. The key is canonical; `aliases` are the keywords
# searched for (case-insensitive) in folder names.
methods:
  isoDTB:
    aliases: [isodtb, iso-dtb]
    workflow: isoDTB.workflow
    fasta: human_reviewed_decoys.fas
    data_type: DDA
    postprocess: [isodtb_sites]
    isodtb_mod_mass: "561.3387"
  TMT:
    aliases: [tmt]
    workflow: TMT10-MS3.workflow
    fasta: human_reviewed_decoys.fas
    data_type: DDA
    postprocess: [tmt_annotation]
  DIA:
    aliases: [dia, diann, dia-nn]
    workflow: DIA.workflow
    fasta: human_reviewed_decoys.fas
    data_type: DIA
    postprocess: []
  # DIA searched by the lab's own DIA-NN instead of FragPipe (docs/ENGINES.md, D39). Replace the DIA
  # entry above with this, or add it under another key with its own aliases:
  # DIA:
  #   engine: diann                      # fragpipe (default) | diann
  #   diann_exe: C:/DIA-NN/2.2.0/diann.exe
  #   fasta: human_reviewed.fasta        # in fasta_dir (no decoys needed: DIA-NN makes its own)
  #   data_type: DIA
  #   library: human_lib.parquet         # optional, in workflow_dir or fasta_dir; else predicted from the FASTA
  #   diann_args: "--var-mods 1 --var-mod UniMod:35,15.994915,M"   # added to Ionomos' defaults
  # DDA label-free searched by the lab's own MaxQuant (docs/ENGINES.md, D50). A new method key also
  # needs a file rule: naming: {methods: {LFQ: '{sample}_{rep}[_{fraction}]'}} for <sample>_<rep>[_<fraction>] names.
  # (The engine decides what the method is: label-free here, DIA for diann, whatever like: says.)
  # LFQ:
  #   engine: maxquant                   # fragpipe (default) | diann | maxquant
  #   maxquant_exe: C:/MaxQuant/2.6.7.0/bin/MaxQuantCmd.exe
  #   fasta: human_reviewed.fasta
  #   data_type: DDA
  #   mqpar: lab_lfq_mqpar.xml           # optional, in workflow_dir: your GUI settings; else MaxQuant's defaults + LFQ
  # ... or by Sage, the open-source engine (docs/ENGINES.md, D51). Sage reads mzML, so .raw files are first
  # converted with ThermoRawFileParser into <experiment>/sage_mzml/.
  # LFQ:
  #   engine: sage                       # fragpipe (default) | diann | maxquant | sage
  #   sage_exe: C:/sage/sage.exe
  #   raw_converter: C:/ThermoRawFileParser/ThermoRawFileParser.exe
  #   fasta: human_reviewed.fasta
  #   data_type: DDA
  #   sage_config: lab_sage.json         # optional, in workflow_dir: your Sage JSON; else tryptic, high-res MS2, LFQ
  #                                      # with quant.tmt (Tmt6 ... Tmt18) in it the method is TMT: tmt.tsv is read (D56)
  #   sage_args: "--batch-size 2"        # optional, added to the sage command line
