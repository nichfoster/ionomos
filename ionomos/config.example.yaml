# ionomos configuration — copy to C:/Fragpipe_Auto/config.yaml and edit.
# Forward slashes are fine on Windows. NO SPACES in any path (FragPipe rule).

paths:
  inbox:        C:/Fragpipe_Auto/inbox
  users_root:   C:/Fragpipe_General          # jobs land in users_root/<USER>/<experiment>
  fragpipe_exe: C:/FragPipe/FragPipe-24.0/fragpipe/bin/fragpipe.bat   # headless launcher; CONFIRM on the PC
  workflow_dir: C:/Fragpipe_Auto/workflows
  fasta_dir:    C:/Fragpipe_Auto/fasta
  database:     C:/Fragpipe_Auto/ionomos.db
  log_dir:      C:/Fragpipe_Auto/logs

watcher:
  poll_seconds: 10
  stable_seconds: 60          # whole-tree fingerprint must be unchanged this long
  min_raw_files: 1

fragpipe:
  auto_run: true              # run FragPipe on queued jobs automatically (false = only file them)
  threads: 28                 # machine has 32 logical CPUs
  ram_gb: 48                  # machine has 64 GB
  timeout_minutes: 240
  min_free_gb: 20             # a search waits while the data drive has less free space than this + its raws
  config_tools_folder: ""     # leave blank unless the first headless run can't find tools
  config_diann: ""            # e.g. C:/DIA-NN/2.3.2/DiaNN.exe — DIA only, if needed

# What happens after FragPipe: statistics, volcano plots and results/report.html.
# An experiment can override any of these in its experiment.yaml under analysis:
# (e.g. comparisons: ["Drug vs DMSO"], control: DMSO).
analysis:
  enabled: true
  test: moderated            # moderated (limma-style empirical Bayes, recommended for n=3) | welch | student
  log2fc: 1.0                # |log2 fold change| needed to call a hit
  alpha: 0.05                # significance cut-off
  use_adjusted: true         # alpha applies to Benjamini-Hochberg q-values
  min_valid: 2               # values needed per group to test a protein/site
  normalize: median          # median | none (intensities only)
  top_labels: 15             # hit names written on each volcano
  control_keywords: [DMSO, vehicle, veh, ctrl, control, mock, untreated, NT, WT, EV, scr, scramble, siNT, PBS]
  # block: replicate         # the replicate number as a block (batch / pair) in the limma model (D42)
  # variance_prior: deqms    # limma (default) | deqms: prior variance by peptide count (D43)

# Who is who. Users are the subfolders of users_root; a new user = a new folder.
# Aliases let initials in a folder name resolve to that folder.
users:
  aliases:
    Isaac: [IJ, IJD]
    EJQ: [EJQ_2]
  default: ""                 # e.g. "_unsorted" — file unrecognised users there instead of rejecting
  # learned_aliases_file: C:/Fragpipe_Auto/learned_aliases.yaml   # written by the resolver window

# The naming window: shows every drop for review before it is filed (review_drops), and asks when a
# folder can't be interpreted (unknown user, no method, odd file names, uneven fractions). Needs the
# watcher to run in an interactive session (Task Scheduler "run only when user is logged on").
gui:
  enabled: true
  review_drops: true          # show how each drop was read (conditions, replicates, control) before filing
  timeout_minutes: 0          # 0 = wait for a person; N = after N minutes a review files as read, a problem is skipped

# DIA short forms: a 1-2 letter code glued to the replicate, X_D1 = DMSO rep 1, X_C2 = Compound rep 2.
# Longer codes count only when listed here.
naming:
  condition_codes:
    D: DMSO
    C: Compound
  # Another lab's convention (docs/NAMING_CONVENTION.md "Other conventions"). Leave these out to keep
  # the built-in rules; check a change with `ionomos names test <folder> <file.raw> ...`.
  # date_formats: [YYYYMMDD, MMDDYYYY, MMDDYY]   # also DDMMYYYY, DDMMYY, YYMMDD; tried in order
  # methods:                                     # how each method's .raw names are read (quote templates)
  #   isoDTB: '{sample}_{rep}[_{fraction}]'      # the built-in rules, written out
  #   TMT: '{sample}[_TMT][_{fraction}]'
  #   DIA: '{sample}[_{rep}]'
  #   (or, for WT-a_rep1.raw / KO-b_rep2.raw:  DIA: '{condition}_rep{rep}')
  #   LFQ: {files: '{sample}_R{rep}_F{fraction}'}   # a new method (add methods.LFQ below too)
  #   SWATH: {like: DIA}                         # DIA's rule under another method name
  #   PLATE: {pattern: '(?P<sample>[A-H]\d{2})-(?P<rep>\d+)'}   # a regex with named groups

# One entry per method. The key is canonical; `aliases` are the keywords
# searched for (case-insensitive) in folder names.
methods:
  isoDTB:
    aliases: [isodtb, iso-dtb]
    workflow: isoDTB.workflow
    fasta: human_reviewed_decoys.fas
    data_type: DDA
    postprocess: [isodtb_sites]
    isodtb_mod_mass: "561.3387"
  TMT:
    aliases: [tmt]
    workflow: TMT10-MS3.workflow
    fasta: human_reviewed_decoys.fas
    data_type: DDA
    postprocess: [tmt_annotation]
  DIA:
    aliases: [dia, diann, dia-nn]
    workflow: DIA.workflow
    fasta: human_reviewed_decoys.fas
    data_type: DIA
    postprocess: []
  # DIA searched by the lab's own DIA-NN instead of FragPipe (docs/ENGINES.md, D39). Replace the DIA
  # entry above with this, or add it under another key with its own aliases:
  # DIA:
  #   engine: diann                      # fragpipe (default) | diann
  #   diann_exe: C:/DIA-NN/2.2.0/diann.exe
  #   fasta: human_reviewed.fasta        # in fasta_dir (no decoys needed: DIA-NN makes its own)
  #   data_type: DIA
  #   library: human_lib.parquet         # optional, in workflow_dir or fasta_dir; else predicted from the FASTA
  #   diann_args: "--var-mods 1 --var-mod UniMod:35,15.994915,M"   # added to Ionomos' defaults
