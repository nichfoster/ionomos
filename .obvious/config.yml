# Obvious Autobuild repo policy — keys per https://help.obvious.ai/autobuild/config-yml-reference
branches:
  defaultBase: master
  default: master            # legacy key written by Obvious onboarding

pr:
  merge:
    method: squash

# Agents merge their own PRs once CI is green (the automerge workflow also does).
merge:
  method: squash
  require_human_merge: false   # legacy key; was true, which parked every PR for a human

reviews:
  automated:
    enabled: true               # run Obvious's review -> repair loop before merge
