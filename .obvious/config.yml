# Obvious Autobuild repo policy — keys per https://help.obvious.ai/autobuild/config-yml-reference
branches:
  defaultBase: master
  default: master            # legacy key written by Obvious onboarding

pr:
  merge:
    method: squash

# Agents open PRs; a person reviews and merges them (D31). The automerge
# workflow was removed on 2026-09-27.
merge:
  method: squash
  require_human_merge: true

reviews:
  automated:
    enabled: true               # run Obvious's review -> repair loop before merge
